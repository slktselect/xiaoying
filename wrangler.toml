# Cloudflare Worker 配置
# 文档: https://developers.cloudflare.com/workers/wrangler/configuration/
name = "xiaoying"
main = "worker/index.js"
compatibility_date = "2026-10-09"

# 部署前先构建前端。
# Cloudflare 的 Git 自动构建默认只跑 `npx wrangler deploy`，不会执行 npm run build，
# 没有这段就会报 "assets.directory ... does not exist: dist"。
[build]
command = "npm run build"

# 静态站点（简历页面）：Vite 构建产物
[assets]
directory = "./dist"
run_worker_first = ["/v/*", "/sign", "/api/*"]

# R2 对象存储绑定（简历视频）
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "xiaoying-video"

# KV：每日用量统计（免费额度护栏）
# 启用步骤：
#   1. npx wrangler kv namespace create xiaoying-usage
#   2. 把输出的 id 填到下面的 id = "..." 里，并删掉这行注释
# 未启用时配额功能自动降级为"不限制"，deploy 不受影响。
# [[kv_namespaces]]
# binding = "USAGE"
# id = "粘贴 kv namespace create 输出的 id"

# ---------- 明文配置（非敏感） ----------
[vars]
# 允许通过 /api/video 播放的 R2 对象 key，逗号分隔；留空 = 不限制（建议生产环境务必配置）
VIDEO_KEYS = "videos/*"

# /api/video 与 /v/* 使用的 Referer 白名单，逗号分隔；留空 = 不校验
# 只有白名单来源的页面才能拿到播放地址 / 播放视频（防盗链核心）
# 若以后要嵌到别的站点，把对应域名加进来；
# 本地 npm run dev 调试时临时追加 localhost、127.0.0.1，否则会 403
ALLOW_REFERERS = "xiaoying.68a02a26.nip.io"

# 无 Referer 的直接访问是否放行（ALLOW_REFERERS 非空时生效）
ALLOW_EMPTY_REFERER = "0"

# 签名是否绑定客户端 IP（1 = 开启；移动端换网络会失效，慎用）
BIND_IP = "0"

# ---------- 免费额度护栏 ----------
# 每天允许的次数（含 /api/video 与 /v/*）；0 = 不限制
# Workers 免费计划上限约 10 万次/天，这里设一半留余量
DAILY_REQUEST_LIMIT = "50000"

# 每天允许的出网字节数；0 = 不限制。5 GiB = 5368709120
# R2 出网本身免费，限制它主要是防止被刷导致 Class B 操作数暴涨
DAILY_BYTES_LIMIT = "5368709120"

# 用量写回 KV 的最小间隔（秒），越大越省 KV 写额度
QUOTA_FLUSH_INTERVAL = "600"

# 1 = 超限返回 429；0 = 只统计不拦截
QUOTA_ENFORCE = "1"

# 允许查看 /usage 用量接口的客户端 IP，逗号分隔；留空 = 该接口对所有人 403
USAGE_ALLOW_IPS = ""

# ---------- CDN 免费分发 ----------
# 签名过期时间的对齐粒度（秒）。
# 同一窗口内所有访客拿到的 URL 完全相同 -> Cloudflare 边缘节点可以共享同一份缓存，
# 绝大多数请求由 CDN 直出，不再回源到 R2 / Worker。
SIGN_WINDOW = "300"

# 视频响应在 CDN 与浏览器上的最长缓存时间（秒）
CDN_CACHE_MAX_AGE = "300"

# 视频响应的缓存模式：public = 交给 Cloudflare CDN 缓存（省回源，但替换 R2 对象后最长 300 秒才生效）
#                   no-store = 完全不缓存，替换对象后立即生效
CDN_CACHE_MODE = "public"

# 单次 Range 请求返回的字节上限；0 = 不限制（推荐）
# 注意：单次请求返回得越大，总的请求数与 R2 读操作次数越少；
# 只有在确实想压一次响应的体积时才设这个值（如 16777216 = 16 MiB）
MAX_RANGE_BYTES = "0"

# 播放链接有效期（秒），会向上取整到 SIGN_WINDOW 的整数倍。
# HLS 会按需逐个拉取分片，300 秒太短（暂停一会儿再拖进度条就会过期），故放宽到 30 分钟；
# 防盗链仍由 Referer 白名单 + 签名兜底。
PLAY_TTL = "1800"

# ---------- 敏感配置：用 Secret，不要写在这里 ----------
# npx wrangler secret put SIGN_SECRET   # HMAC 签名密钥
# npx wrangler secret put SIGN_TOKEN    # /sign 接口鉴权令牌（可选，业务后端签发时用）
