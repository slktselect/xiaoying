# Cloudflare Worker 配置
# 文档: https://developers.cloudflare.com/workers/wrangler/configuration/
name = "xiaoying"
main = "src/index.js"
compatibility_date = "2026-10-09"

# 静态站点（简历页面）
[assets]
directory = "./public"
run_worker_first = ["/v/*", "/sign", "/api/*"]

# R2 对象存储绑定（简历视频）
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "xiaoying-video"

# ---------- 明文配置（非敏感） ----------
[vars]
# 允许通过 /api/video 播放的 R2 对象 key，逗号分隔；留空 = 不限制（建议生产环境务必配置）
VIDEO_KEYS = "gna.mp4"

# /api/video 与 /v/* 使用的 Referer 白名单，逗号分隔；留空 = 不校验
# 部署后请把你的域名填进来，例如：
# ALLOW_REFERERS = "resume.example.com,*.workers.dev,*.pages.dev"
ALLOW_REFERERS = ""

# 无 Referer 的直接访问是否放行（ALLOW_REFERERS 非空时生效）
ALLOW_EMPTY_REFERER = "0"

# 签名是否绑定客户端 IP（1 = 开启；移动端换网络会失效，慎用）
BIND_IP = "0"

# 播放链接有效期（秒）
PLAY_TTL = "300"

# 响应 Cache-Control 的最大 max-age（秒），实际会再与签名过期时间取小
CACHE_MAX_AGE = "3600"

# ---------- 敏感配置：用 Secret，不要写在这里 ----------
# npx wrangler secret put SIGN_SECRET   # HMAC 签名密钥
# npx wrangler secret put SIGN_TOKEN    # /sign 接口鉴权令牌（可选，业务后端签发时用）
