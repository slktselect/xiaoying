<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="个人在线简历">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <title>个人简历</title>
</head>
<body>
  <header class="hero" id="top">
    <div class="wrap hero-inner">
      <div class="avatar" data-avatar></div>
      <div class="hero-text">
        <h1 data-name>加载中…</h1>
        <p class="hero-title" data-title></p>
        <ul class="contacts" data-contacts></ul>
      </div>
    </div>
  </header>

  <nav class="nav">
    <div class="wrap nav-inner" data-nav></div>
  </nav>

  <main class="wrap">
    <div id="content"></div>
    <footer class="foot" data-foot></footer>
  </main>

  <noscript>请开启 JavaScript 以查看完整简历。</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
